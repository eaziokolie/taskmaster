{% extends 'base.html' %}
{% block title %}{{ 'Edit Task' if task else 'New Task' }} - TaskMaster{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-header py-3">
                <h5 class="mb-0 fw-semibold">
                    <i class="bi {{ 'bi-pencil-square' if task else 'bi-plus-circle' }} me-2"></i>
                    {{ 'Edit Task' if task else 'Create New Task' }}
                </h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Title <span class="text-danger">*</span></label>
                        <input type="text" name="title" class="form-control form-control-lg"
                               placeholder="What needs to be done?"
                               value="{{ task.title if task else '' }}" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Description</label>
                        <textarea name="description" class="form-control" rows="3"
                                  placeholder="Add more details (optional)">{{ task.description if task else '' }}</textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Priority</label>
                        <div class="d-flex gap-3">
                            {% for level in ['low', 'medium', 'high'] %}
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="priority"
                                       id="priority_{{ level }}" value="{{ level }}"
                                       {{ 'checked' if (task and task.priority == level) or (not task and level == 'medium') }}>
                                <label class="form-check-label priority-label-{{ level }}" for="priority_{{ level }}">
                                    {{ level | capitalize }}
                                </label>
                            </div>
                            {% endfor %}
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-lg me-1"></i>
                            {{ 'Save Changes' if task else 'Create Task' }}
                        </button>
                        <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary px-4">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
